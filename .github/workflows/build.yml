name: Build plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and package
        run: ./gradlew --no-daemon check buildPlugin verifyPluginStructure
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: idea-rsl-plugin
          path: build/distributions/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: idea-rsl-plugin
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/idea-rsl-plugin-${GITHUB_REF_NAME#v}.zip"
          test -f "$archive"
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "RSL for RS-Bank $GITHUB_REF_NAME" \
            --notes-file - <<'NOTES'
          Плагин для IntelliJ IDEA 2025.1 с подсветкой RSL и статическим анализом макромодулей `.mac`.

          Скачайте ZIP из раздела **Assets** и выберите **Settings → Plugins → ⚙ → Install Plugin from Disk** в IntelliJ IDEA.
          NOTES
