name: Build plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and package
        run: ./gradlew --no-daemon check buildPlugin verifyPluginStructure
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: idea-rsl-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
